<a class="skip-link" href="#main-content">Skip to main content</a>

<div
  class="loading-bar"
  role="status"
  aria-live="polite"
  [class.loading-bar--active]="httpLoading.isLoading()"
>
  <span class="visually-hidden">{{ httpLoading.isLoading() ? 'Loading' : '' }}</span>
</div>

<header>
  <h1>{{ title() }}</h1>
  <nav>
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      #homeLink="routerLinkActive"
      [attr.aria-current]="homeLink.isActive ? 'page' : null"
    >
      Home
    </a>
    <a
      routerLink="/counter"
      routerLinkActive="active"
      #counterLink="routerLinkActive"
      [attr.aria-current]="counterLink.isActive ? 'page' : null"
    >
      Counter
    </a>
    <a
      routerLink="/feedback"
      routerLinkActive="active"
      #feedbackLink="routerLinkActive"
      [attr.aria-current]="feedbackLink.isActive ? 'page' : null"
    >
      Feedback
    </a>
    <a
      routerLink="/posts"
      routerLinkActive="active"
      #postsLink="routerLinkActive"
      [attr.aria-current]="postsLink.isActive ? 'page' : null"
    >
      Posts
    </a>
  </nav>
  <button
    type="button"
    class="theme-toggle"
    [attr.aria-pressed]="themePreference.current() === 'dark'"
    [attr.aria-label]="
      themePreference.current() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
    "
    (click)="themePreference.toggle()"
  >
    {{ themePreference.current() === 'dark' ? '🌙' : '☀️' }}
  </button>
  <button
    type="button"
    class="favorite-toggle"
    [attr.aria-pressed]="isCurrentPageFavorite()"
    [attr.aria-label]="
      isCurrentPageFavorite() ? 'Remove this page from favorites' : 'Add this page to favorites'
    "
    (click)="toggleFavorite()"
  >
    {{ isCurrentPageFavorite() ? '★' : '☆' }}
  </button>
</header>

<main id="main-content" tabindex="-1">
  <router-outlet />
</main>

<app-toast-container />
