<h2>Posts</h2>
<p>Fetched live from a public API using <code>httpResource</code>.</p>

<p class="status" aria-live="polite" [attr.aria-busy]="postsResource.isLoading()">
  @if (postsResource.isLoading()) {
    Loading posts…
  }
</p>

<ul class="posts-list">
  @for (post of postsResource.value(); track post.id) {
    <li>
      <h3>{{ post.title }}</h3>
      <p>{{ post.body }}</p>
    </li>
  }
</ul>
