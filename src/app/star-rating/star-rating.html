<div class="star-rating" role="group" [attr.aria-label]="label()">
  @for (star of stars(); track star) {
    <button
      type="button"
      [attr.aria-pressed]="value() >= star"
      [attr.aria-label]="star + (star === 1 ? ' star' : ' stars')"
      (click)="rate(star)"
    >
      {{ value() >= star ? '★' : '☆' }}
    </button>
  }
</div>
